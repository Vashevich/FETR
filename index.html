<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ФЕТР — параметрический потолок в сетку Армстронг</title>
<meta name="description" content="Конфигуратор ламельных кассет из фетра для подвесного потолка Армстронг: узор, 3D, раскрой листов и DXF для ЧПУ.">
<style>
:root{
  --bg:#0e1413; --panel:#141c1b; --panel2:#1a2423; --line:#26332f; --line2:#31423d;
  --text:#e6efec; --mute:#8fa39d; --acc:#3ecfbe; --acc2:#1f8f84; --warn:#f0a84a; --key:#e08a3c;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand h1{margin:0;font-size:17px;letter-spacing:.2px;font-weight:700}
.brand p{margin:0;color:var(--mute);font-size:11px}
.stats{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-family:var(--mono);font-size:12px;white-space:nowrap}
.stat b{font-weight:700}
.stat span{color:var(--mute);margin-left:4px}
.btn{font:600 12px var(--sans);border-radius:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#04201c}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
main{flex:1;display:flex;min-height:0}
aside{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.ptab{background:var(--panel2);border:1px solid var(--line2);color:var(--mute);border-radius:6px;padding:6px 10px;font:600 12px var(--sans);cursor:pointer;white-space:nowrap}
.ptab.on{color:#04201c;background:var(--acc);border-color:var(--acc)}
.panes{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 30px;-webkit-overflow-scrolling:touch}
.pane{display:none}.pane.on{display:block}
.pane .btn{width:100%;margin-bottom:8px}
.pane .stats{margin-bottom:12px}
.upd2{display:none}
aside h2{font:700 10px var(--sans);letter-spacing:1.4px;color:var(--mute);text-transform:uppercase;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
aside h2:first-child{border-top:0;margin-top:6px}
.hint{color:var(--mute);font-size:11px;margin:0 0 10px}
.f{margin:0 0 11px}
.f label{display:block;font-size:12px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:8px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.num{width:74px;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:0 6px}
.num input{width:100%;background:none;border:0;color:var(--text);font:12px var(--mono);padding:5px 0;outline:none;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none}
.num i{font-style:normal;color:var(--mute);font-size:10px;margin-left:3px}
select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:5px;padding:7px 8px;font:12px var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:14px;padding:4px 10px;font:12px var(--sans);cursor:pointer}
.chip:hover,.chip.on{border-color:var(--acc);color:var(--acc)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);cursor:pointer;padding:0}
.sw button.on{border-color:#fff}
.sw input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--line2);background:none;border-radius:5px}
.check{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:10px;cursor:pointer}
.check input{accent-color:var(--acc);width:15px;height:15px}
section.work{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:2px;padding:6px 14px 0;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:600 12px var(--sans);padding:8px 12px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--acc)}
#btnAR{color:var(--acc)}
.warns{padding:0 14px}
.warn{margin-top:8px;border:1px solid #6b4a1c;background:#2a1f10;color:var(--warn);padding:6px 10px;border-radius:5px;font-size:12px}
.view{flex:1;min-height:0;overflow:auto;padding:14px;display:none;position:relative}
.view.on{display:block}
#v3d{padding:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#2a3433,#161d1c 75%)}
#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.vbtns{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
.vnote{position:absolute;right:12px;bottom:12px;color:var(--mute);font-size:11px;background:#0008;padding:4px 8px;border-radius:4px}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:120px}
.card small{color:var(--mute);display:block;font-size:11px}
.card b{font:700 15px var(--mono)}
.card em{font-style:normal;color:var(--mute);font-size:11px;display:block}
.note{color:var(--mute);font-size:12px;max-width:760px;margin:0 0 14px}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.sheet .cap{display:flex;justify-content:space-between;font:11px var(--mono);margin-bottom:6px}
.sheet .cap span{color:var(--mute)}
.sheet svg{width:100%;height:auto;display:block;background:#0a0f0e;border:1px solid var(--line2)}
.plan-wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px;overflow:auto}
#plan{display:block;max-width:100%;height:auto;max-height:62vh;margin:0 auto}
#plan .cellhit{cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin:8px 0 0}
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kcard h4{margin:0 0 6px;font:700 13px var(--mono)}
.kcard h4 span{color:var(--mute);font-weight:400}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:11px}
td.n,th.n{text-align:right;font-family:var(--mono)}
td.m{font-family:var(--mono)}
.spec{max-width:900px}
.spec h3{font-size:13px;margin:18px 0 6px}
.steps{max-width:760px;padding-left:18px;color:var(--text);font-size:12.5px}
.steps li{margin-bottom:5px}
.mini{display:block}
footer{display:none}
#arui{display:none;position:fixed;inset:0;z-index:50;background:transparent;color:#fff;font:14px var(--sans)}
#arui.on{display:block}
#arui.cam{background:#000}
#arui video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#arui canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#arui .top{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(#000a,#0000);text-align:center;text-shadow:0 1px 3px #000;pointer-events:none}
#arui .bot{position:absolute;left:0;right:0;bottom:0;padding:12px 10px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000b);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
#arui .bot button{font:600 14px var(--sans);min-width:48px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid #fff6;background:#0009;color:#fff}
#arui .bot button.x{background:var(--acc);color:#04201c;border-color:var(--acc)}
#arui .bot span{font:13px var(--mono);min-width:110px;text-align:center}
.upd{display:none;font:600 12px var(--sans);border-radius:14px;border:1px solid var(--warn);background:#2a1f10;color:var(--warn);padding:5px 12px;cursor:pointer;margin-top:5px}
body.hasupd .upd{display:inline-block}
.tabs .upd{margin:2px 0 4px auto;flex:none}
#armsg{display:none;position:fixed;inset:0;z-index:60;background:#000b;align-items:center;justify-content:center;padding:20px}
#armsg.on{display:flex}
#armsg div{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:20px;max-width:440px;font-size:14px;line-height:1.5}
#armsg button{margin-top:14px}
@media (min-width:821px){ .tabs .upd{display:none !important} .onlym{display:none} }
.pane h2{display:none}
@media (max-width:820px){
  html,body{height:100%;overflow:hidden}
  body{height:100dvh}
  header{display:none}
  main{flex-direction:column}
  section.work{order:-1;flex:1 1 0;min-height:0}
  aside{width:auto;flex:0 0 36dvh;height:36dvh;border-right:0;border-top:1px solid var(--line2)}
  .ptabs{flex-wrap:nowrap;overflow-x:auto;padding:7px 10px;scrollbar-width:none}
  .ptabs::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
  .panes{padding:10px 14px 24px}
  .pane h2{display:none}
  .tabs{padding:calc(2px + env(safe-area-inset-top)) 8px 0;scrollbar-width:none}
  .tab{padding:8px 10px}
  .view{padding:10px}
  #v3d{padding:0}
  .vnote{display:none}
  .vbtns{left:8px;bottom:8px}
  .vbtns .btn{padding:6px 10px}
  .row input[type=range]{height:28px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>ФЕТР · параметрический потолок</h1>
    <p>Ламельные кассеты из фетра в сетку Армстронг · раскрой для ЧПУ</p>
    <button class="upd">Вышла новая версия — обновить ↻</button>
  </div>
  <div class="stats" id="stats"></div>
  <button class="btn primary" id="btnZip">Файлы для ЧПУ (.zip)</button>
  <button class="btn" id="btnCsv">Спецификация .csv</button>
</header>
<main>
  <aside id="side"></aside>
  <section class="work">
    <div class="tabs" role="tablist">
      <button class="tab on" data-v="v3d">3D-вид</button>
      <button class="tab" id="btnAR">AR на потолке</button>
      <button class="tab" data-v="vplan">План и монтаж</button>
      <button class="tab" data-v="vnest">Раскрой листов</button>
      <button class="tab" data-v="vspec">Спецификация</button>
      <button class="tab" data-v="vhow">Конструкция</button>
      <button class="upd">Новая версия — обновить ↻</button>
    </div>
    <div class="warns" id="warns"></div>
    <div class="view on" id="v3d">
      <canvas id="gl"></canvas>
      <div class="vbtns">
        <button class="btn" data-cam="persp">Перспектива</button>
        <button class="btn" data-cam="below">Снизу</button>
        <button class="btn" data-cam="side">Сбоку</button>
      </div>
      <div class="vnote">Вращение — мышь / палец, масштаб — колесо</div>
    </div>
    <div class="view" id="vplan"></div>
    <div class="view" id="vnest"></div>
    <div class="view" id="vspec"></div>
    <div class="view" id="vhow"></div>
  </section>
</main>
<div id="arui">
  <div class="top" id="arhint"></div>
  <div class="bot" id="arbot">
    <button data-ar="place" class="x" id="arplace" style="flex-basis:100%;max-width:340px">✓ Поставить на место</button>
    <button data-ar="h-" aria-label="Потолок ниже">−</button><span id="arh"></span><button data-ar="h+" aria-label="Потолок выше">+</button>
    <button data-ar="r-" aria-label="Повернуть влево">⟲</button><button data-ar="r+" aria-label="Повернуть вправо">⟳</button>
    <button data-ar="exit">Выйти</button>
  </div>
</div>
<div id="armsg"><div><span id="armsgt"></span><br><button class="btn primary" id="armsgok">Понятно</button></div></div>
<script>
"use strict";
/* ============================================================
   ФЕТР — конфигуратор ламельных кассет для потолка Армстронг
   Всё в одном файле, без внешних библиотек. Единицы — мм.
   ============================================================ */

// ---------- состояние ----------
const DEF = {
  nx:7, ny:3, cell:600, profile:'T24', gridColor:'white',
  nLam:10, t:9, density:1.9, felt:'#35b3ab',
  pattern:'hypar', size:1, angle:30, alt:'x', seed:22,
  hMin:50, hMax:260, breaks:0, steps:0, invert:false,
  slopeDir:'none', slope:60, fade:0,
  sheetW:1200, sheetH:2400, margin:4, gap:6, keyW:30, marks:true,
  priceSheet:0, priceCut:0,
  cells:{}
};
let S = JSON.parse(JSON.stringify(DEF));
try{ const sv = JSON.parse(localStorage.getItem('fetr-v1')||'null'); if(sv) S = Object.assign(S, sv); }catch(e){}
function persist(){ try{ localStorage.setItem('fetr-v1', JSON.stringify(S)); }catch(e){} }

const FELTS = [['#35b3ab','Бирюза'],['#8c9296','Серый'],['#3b4046','Графит'],['#b9a48c','Беж'],['#3f6fb0','Синий'],['#b5553c','Терракот'],['#6f8f4e','Олива'],['#d9b23c','Горчица']];

const PRESETS = [
  ['Как на видео',   {pattern:'hypar',  size:1,   breaks:0, steps:0, alt:'x', invert:false, slopeDir:'none', fade:0}],
  ['Плавная волна',  {pattern:'wave',   size:4,   angle:30, breaks:0, steps:0, alt:'x'}],
  ['Ломаная',        {pattern:'zigzag', size:3,   angle:45, breaks:0, steps:0, alt:'x'}],
  ['Гранёная волна', {pattern:'wave',   size:3.5, angle:20, breaks:3, steps:0, alt:'checker'}],
  ['Круги',          {pattern:'circles',size:2.5, breaks:0, steps:0, alt:'x'}],
  ['Кристаллы',      {pattern:'crystal',size:2,   breaks:4, steps:0, alt:'checker'}],
  ['Воронка',        {pattern:'funnel', size:1,   breaks:0, steps:0, alt:'x'}],
  ['Дюны',           {pattern:'dunes',  size:4,   breaks:0, steps:0, alt:'x'}],
  ['Террасы',        {pattern:'dunes',  size:4,   breaks:0, steps:5, alt:'checker'}],
];

const CTRL = [
  {sec:'Сетка потолка', tab:'Сетка', hint:'Клик по ячейке на вкладке «План и монтаж» переключает: кассета → обычная плита → светильник.'},
  {k:'nx', label:'Ячеек по ширине', type:'range', min:1, max:20, step:1, unit:'шт'},
  {k:'ny', label:'Ячеек по глубине', type:'range', min:1, max:12, step:1, unit:'шт'},
  {k:'cell', label:'Шаг сетки', type:'select', num:true, opts:[[600,'600 × 600 мм'],[625,'625 × 625 мм'],[610,'610 × 610 мм (24″)']]},
  {k:'profile', label:'Профиль подвесной системы', type:'select', opts:[['T24','T24 — полка 24 мм'],['T15','T15 — полка 15 мм']]},
  {k:'gridColor', label:'Цвет профиля', type:'select', opts:[['white','белый (как есть)'],['felt','в цвет ламелей (покрасить или наклеить)'],['black','чёрный']]},
  {sec:'Узор', tab:'Узор'},
  {presets:true},
  {k:'pattern', label:'Тип узора', type:'select', opts:[['hypar','Гипар — скрутка, как на видео'],['wave','Волна'],['zigzag','Ломаная (зигзаг)'],['circles','Круги на воде'],['funnel','Воронка'],['crystal','Кристаллы'],['dunes','Дюны (шум)']]},
  {k:'size', label:'Размер узора (ячеек на период)', type:'range', min:1, max:12, step:0.5, unit:'яч'},
  {k:'angle', label:'Направление узора', type:'range', min:0, max:180, step:5, unit:'°'},
  {k:'alt', label:'Направление ламелей в кассетах', type:'select', opts:[['x','все вдоль ширины'],['y','все вдоль глубины'],['checker','шахматка'],['random','случайно']]},
  {k:'seed', label:'Вариант случайности', type:'range', min:1, max:99, step:1, unit:''},
  {k:'hMin', label:'Высота ламели — минимум', type:'range', min:30, max:300, step:5, unit:'мм'},
  {k:'hMax', label:'Высота ламели — максимум', type:'range', min:60, max:450, step:5, unit:'мм'},
  {k:'breaks', label:'Изломы ламели (0 — плавная кромка)', type:'range', min:0, max:8, step:1, unit:'шт'},
  {k:'steps', label:'Ступени по высоте (0 — без ступеней)', type:'range', min:0, max:10, step:1, unit:'шт'},
  {k:'invert', label:'Инвертировать (выступы ↔ впадины)', type:'check'},
  {sec:'Уклон и граница', tab:'Форма', hint:'Общая форма всей инсталляции: плавный спад высоты в одну сторону и затухание к краям потолка.'},
  {k:'slopeDir', label:'Общий уклон', type:'select', opts:[['none','нет'],['x+','спад слева направо'],['x-','спад справа налево'],['y+','спад от дальней стены'],['y-','спад к дальней стене']]},
  {k:'slope', label:'Сила уклона', type:'range', min:0, max:100, step:5, unit:'%'},
  {k:'fade', label:'Затухание к краям', type:'range', min:0, max:100, step:5, unit:'%'},
  {sec:'Кассета и материал', tab:'Материал'},
  {k:'nLam', label:'Ламелей в кассете', type:'range', min:4, max:16, step:1, unit:'шт'},
  {k:'t', label:'Толщина фетра', type:'range', min:6, max:12, step:0.5, unit:'мм'},
  {k:'density', label:'Вес листа', type:'range', min:1, max:3, step:0.05, unit:'кг/м²'},
  {colors:true},
  {sec:'Раскрой и станок', tab:'Раскрой'},
  {k:'sheetW', label:'Ширина листа', type:'range', min:1000, max:1500, step:10, unit:'мм'},
  {k:'sheetH', label:'Длина листа', type:'range', min:2000, max:3050, step:10, unit:'мм'},
  {k:'margin', label:'Отступ от края листа', type:'range', min:0, max:20, step:1, unit:'мм'},
  {k:'gap', label:'Зазор между деталями', type:'range', min:2, max:15, step:1, unit:'мм'},
  {k:'marks', label:'Маркировка деталей (слой MARK)', type:'check'},
  {sec:'Стоимость (необязательно)', tab:'Файлы', files:true},
  {k:'priceSheet', label:'Цена листа', type:'range', min:0, max:20000, step:100, unit:'₽'},
  {k:'priceCut', label:'Резка за погонный метр', type:'range', min:0, max:200, step:5, unit:'₽'},
  {reset:true}
];

// ---------- утилиты ----------
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = (v,d=0) => v.toLocaleString('ru-RU',{minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(i,j,s){ let h = (i*374761393 + j*668265263 + s*2147483647) | 0; h = (h ^ (h>>>13)) * 1274126177 | 0; h ^= h>>>16; return (h>>>0) / 4294967296; }
const smooth = t => t*t*(3-2*t);
function vnoise(x,y,s){ const xi=Math.floor(x), yi=Math.floor(y), fx=smooth(x-xi), fy=smooth(y-yi);
  const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy; }
const tri = x => { const m = ((x%2)+2)%2; return Math.abs(m-1); };  // период 2, 1→0→1

// ---------- поле высот: X,Y в ячейках, результат 0..1 ----------
function field(X,Y){
  const s = S.size, x = X/s, y = Y/s, a = S.angle*Math.PI/180;
  let f;
  switch(S.pattern){
    case 'hypar':  f = 0.5 + 2*(tri(x)-0.5)*(tri(y)-0.5); break;
    case 'wave':   f = 0.5 + 0.5*Math.sin(2*Math.PI*(x*Math.cos(a)+y*Math.sin(a))); break;
    case 'zigzag': f = tri(2*(x*Math.cos(a)+y*Math.sin(a))); break;
    case 'circles':{ const r = Math.hypot(X-S.nx/2, Y-S.ny/2)/s; f = 0.5+0.5*Math.cos(2*Math.PI*r); break; }
    case 'funnel': { const r = Math.hypot(X-S.nx/2, Y-S.ny/2), rm = Math.hypot(S.nx/2,S.ny/2); f = 1 - smooth(clamp(r/(rm*0.9),0,1)); break; }
    case 'crystal':{ const xi=Math.floor(x), yi=Math.floor(y); let d1=9;
      for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){ const px=xi+di+hash(xi+di,yi+dj,S.seed), py=yi+dj+hash(xi+di,yi+dj,S.seed+57); d1=Math.min(d1, Math.hypot(x-px,y-py)); }
      f = 1 - clamp(d1/0.8,0,1); break; }
    case 'dunes':  f = clamp((vnoise(x*1.0,y*1.0,S.seed)*0.68 + vnoise(x*2.3+7,y*2.3+3,S.seed+11)*0.32 - 0.2)/0.6, 0, 1); break;
    default: f = 0.5;
  }
  if(S.invert) f = 1-f;
  if(S.steps>=2) f = Math.round(f*(S.steps-1))/(S.steps-1);
  // общий уклон и затухание
  if(S.slopeDir!=='none' && S.slope>0){
    let p = S.slopeDir[0]==='x' ? X/S.nx : Y/S.ny; if(S.slopeDir[1]==='-') p = 1-p;
    f *= 1 - (S.slope/100)*clamp(p,0,1);
  }
  if(S.fade>0){
    const d = Math.min(X, S.nx-X, Y, S.ny-Y), w = Math.max(0.3, (S.fade/100)*Math.min(S.nx,S.ny)/2);
    f *= smooth(clamp(d/w,0,1));
  }
  return clamp(f,0,1);
}

// ---------- геометрия узла ----------
function geom(){
  const flange = S.profile==='T24' ? 24 : 15;
  const lidS = S.cell - (S.profile==='T24' ? 8 : 6);       // крышка лежит на полках
  const Lb = S.cell - flange - 8;                           // тело ламели проходит между полками
  const t = S.t, winW = S.keyW + 1, bridge = 14;
  const tabW = winW + 2*bridge, winH = t + 0.8, tabH = t + winH + bridge;
  const tabX = [Math.round(Lb*0.22 - tabW/2), Math.round(Lb*0.78 - tabW/2)];
  return {flange, lidS, Lb, t, winW, bridge, tabW, winH, tabH, tabX, keyLen: lidS-4, keyW:S.keyW,
          pitch: Lb/S.nLam, a0:(S.cell-Lb)/2, M: S.breaks>0 ? S.breaks+1 : 24};
}
function simplify(pts, tol=0.5){ // Дуглас — Пекер: высоты округлены до мм, прямые кромки остаются прямыми
  const keep=new Uint8Array(pts.length); keep[0]=keep[pts.length-1]=1; const st=[[0,pts.length-1]];
  while(st.length){ const [i,j]=st.pop(), a=pts[i], c=pts[j], L=Math.hypot(c[0]-a[0],c[1]-a[1])||1; let m=-1, md=tol;
    for(let k=i+1;k<j;k++){ const d=Math.abs((pts[k][0]-a[0])*(c[1]-a[1])-(pts[k][1]-a[1])*(c[0]-a[0]))/L; if(d>md){ md=d; m=k; } }
    if(m>0){ keep[m]=1; st.push([i,m],[m,j]); } }
  return pts.filter((_,i)=>keep[i]);
}
function polyArea(p){ let a=0; for(let i=0;i<p.length;i++){ const q=p[(i+1)%p.length]; a+=p[i][0]*q[1]-q[0]*p[i][1]; } return Math.abs(a)/2; }
function polyLen(p){ let l=0; for(let i=0;i<p.length;i++){ const q=p[(i+1)%p.length]; l+=Math.hypot(q[0]-p[i][0], q[1]-p[i][1]); } return l; }
const rect = (x,y,w,h) => [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];

// контур ламели в координатах детали: x вдоль, y вверх; верхняя кромка y=0, тело ниже
function lamShape(hs,G){
  const M = hs.length-1, edge = simplify(hs.map((h,i)=>[G.Lb*i/M, -h]));
  const o = [[0,0]];
  for(const x of G.tabX){ o.push([x,0],[x,G.tabH],[x+G.tabW,G.tabH],[x+G.tabW,0]); }
  o.push([G.Lb,0]);
  for(let i=edge.length-1;i>=0;i--) o.push(edge[i]);
  const holes = G.tabX.map(x => rect(x+G.bridge, G.t, G.winW, G.winH));
  return {outer:o, holes, edge};
}
function lidShape(G){
  const o = (S.cell-G.lidS)/2, holes=[];
  for(let k=0;k<S.nLam;k++){
    const c = G.a0 + G.pitch*(k+0.5) - o;
    for(const x of G.tabX) holes.push(rect(G.a0 + x - 0.5 - o, c-(G.t+0.6)/2, G.tabW+1, G.t+0.6));
  }
  return {outer:rect(0,0,G.lidS,G.lidS), holes};
}

// ---------- модель ----------
let M = null;
function build(){
  const warns=[];
  S.nx=Math.round(S.nx); S.ny=Math.round(S.ny); S.nLam=Math.round(S.nLam);
  if(S.hMax < S.hMin+10){ S.hMax = S.hMin+10; }
  const G = geom();
  if(G.pitch < G.t+14) warns.push(`Ламели стоят слишком часто: шаг ${fmt(G.pitch,1)} мм при толщине ${G.t} мм — между пазами крышки остаётся мало материала. Уменьшите число ламелей.`);
  const types = new Map(), cassT = new Map(), cells=[];
  let nCass=0, nLam=0, nTile=0, nLight=0;
  for(let j=0;j<S.ny;j++) for(let i=0;i<S.nx;i++){
    const kind = S.cells[i+','+j] || 'cass';
    const cell = {i,j,kind};
    cells.push(cell);
    if(kind==='tile'){ nTile++; continue; } if(kind==='light'){ nLight++; continue; }
    nCass++;
    let dir = S.alt; if(dir==='checker') dir = (i+j)%2 ? 'y':'x'; else if(dir==='random') dir = hash(i,j,S.seed+5)<0.5 ? 'x':'y';
    let r = dir==='x' ? 0 : 90;
    const lams=[];
    for(let k=0;k<S.nLam;k++){
      const v = G.a0 + G.pitch*(k+0.5), hs=[];
      for(let m=0;m<=G.M;m++){
        const u = G.a0 + G.Lb*m/G.M;
        const X = r===0 ? i + u/S.cell : i + 1 - v/S.cell, Y = r===0 ? j + v/S.cell : j + u/S.cell;
        hs.push(Math.round(S.hMin + (S.hMax-S.hMin)*field(X,Y)));
      }
      lams.push({hs, v});
    }
    // типы ламелей (зеркальные — одна и та же деталь)
    for(const l of lams){
      const a = l.hs.join(','), b = l.hs.slice().reverse().join(',');
      const key = a<=b ? a : b;
      let T = types.get(key);
      if(!T){ T = {key, hs: a<=b ? l.hs.slice() : l.hs.slice().reverse(), count:0}; types.set(key,T); }
      T.count++; l.T = T; l.flip = (a!==key); nLam++;
    }
    cell.r = r; cell.lams = lams; cell.dir = dir;
  }
  // нумерация типов: по убыванию количества
  const typeList = [...types.values()].sort((a,b)=> b.count-a.count || (a.key<b.key?-1:1));
  typeList.forEach((T,n)=>{ T.id = 'L'+String(n+1).padStart(2,'0'); T.shape = lamShape(T.hs,G);
    T.maxH = Math.max(...T.hs); T.area = polyArea(T.shape.outer) - T.shape.holes.reduce((s,h)=>s+polyArea(h),0);
    T.perim = polyLen(T.shape.outer) + T.shape.holes.reduce((s,h)=>s+polyLen(h),0); });
  // типы кассет (с учётом поворота на 180°)
  for(const c of cells){ if(c.kind!=='cass') continue;
    const s1 = c.lams.map(l=>l.T.id+(l.flip?'*':'')).join(' ');
    const s2 = c.lams.slice().reverse().map(l=>{ const sym = l.T.hs.join(',')===l.T.hs.slice().reverse().join(','); return l.T.id+((!l.flip && !sym)?'*':''); }).join(' ');
    let seq = s1; if(s2 < s1){ seq = s2; c.r += 180; }
    let K = cassT.get(seq); if(!K){ K = {seq, count:0, cells:[]}; cassT.set(seq,K); }
    K.count++; K.cells.push(c); c.K = K;
  }
  const cassList = [...cassT.values()].sort((a,b)=> b.count-a.count || (a.seq<b.seq?-1:1));
  cassList.forEach((K,n)=>{ K.id = 'K'+String(n+1).padStart(2,'0');
    K.items = K.seq.split(' ').map(s=>({T: typeList.find(T=>T.id===s.replace('*','')), flip: s.endsWith('*')})); });

  const lid = lidShape(G);
  lid.area = polyArea(lid.outer) - lid.holes.reduce((s,h)=>s+polyArea(h),0);
  lid.perim = polyLen(lid.outer) + lid.holes.reduce((s,h)=>s+polyLen(h),0);
  const key = {outer: rect(0,0,G.keyLen,G.keyW), holes:[], area:G.keyLen*G.keyW, perim:2*(G.keyLen+G.keyW)};

  const nest = doNest(G, typeList, lid, key, nCass, warns);
  const partArea = typeList.reduce((s,T)=>s+T.area*T.count,0) + nCass*(lid.area + 2*key.area);
  const cutLen = typeList.reduce((s,T)=>s+T.perim*T.count,0) + nCass*(lid.perim + 2*key.perim);
  const sheetArea = nest.sheets.length*S.sheetW*S.sheetH;
  M = {G, cells, typeList, cassList, lid, key, nest, warns,
       st:{nCass,nLam,nTile,nLight,types:typeList.length, sheets:nest.sheets.length, partArea, cutLen, sheetArea,
           weight: partArea/1e6*S.density, usage: sheetArea? partArea/sheetArea*100 : 0, nParts: nLam + nCass*3,
           cost: nest.sheets.length*S.priceSheet + cutLen/1000*S.priceCut}};
}

// ---------- раскрой ----------
function doNest(G, typeList, lid, key, nCass, warns){
  const W=S.sheetW, H=S.sheetH, m=S.margin, g=S.gap, Lb=G.Lb, Mn=G.M;
  // 1) пары ламелей: вторая повёрнута и вложена по кривой кромке
  const inst=[]; for(const T of typeList) for(let n=0;n<T.count;n++) inst.push(T);
  inst.sort((a,b)=> b.maxH-a.maxH || (a.id<b.id?-1:1));
  const cache = new Map();
  const pairD = (A,B,mode) => { const k=A.id+'|'+B.id+'|'+mode; let d=cache.get(k);
    if(d===undefined){ d=0; for(let i=0;i<=Mn;i++) d=Math.max(d, A.hs[i] + (mode ? B.hs[i] : B.hs[Mn-i])); cache.set(k,d); } return d; };
  const bodyA = T => T.area - 2*G.tabW*(G.tabH) + 2*G.winW*G.winH;
  const used = new Uint8Array(inst.length), items=[];
  for(let i=0;i<inst.length;i++){ if(used[i]) continue; used[i]=1; const A=inst[i];
    let best=null, seen=0;
    for(let j=i+1;j<inst.length && seen<60;j++){ if(used[j]) continue; seen++;
      for(let mode=0;mode<2;mode++){ const D=pairD(A,inst[j],mode), waste=D*Lb-bodyA(A)-bodyA(inst[j]);
        if(!best || waste<best.waste-1e-6) best={j,mode,D,waste}; }
    }
    if(best){ used[best.j]=1; const B=inst[best.j]; let sl=0; // зазор меряем по нормали к наклонной кромке
      for(let q=0;q<Mn;q++) sl=Math.max(sl, Math.abs(A.hs[q+1]-A.hs[q]), Math.abs(B.hs[q+1]-B.hs[q]));
      const D=Math.ceil(best.D + g*Math.hypot(1, sl/(Lb/Mn)));
      items.push({kind:'pair', w:Lb, h:2*G.tabH+D, A, B, mode:best.mode, D}); }
    else items.push({kind:'single', w:Lb, h:G.tabH+A.maxH, A});
  }
  for(let n=0;n<nCass;n++) items.push({kind:'lid', w:G.lidS, h:G.lidS});
  for(let n=0;n<nCass*2;n++) items.push({kind:'key', w:G.keyLen, h:G.keyW});
  items.sort((a,b)=> b.h-a.h || b.w-a.w);
  // 2) полки + досыпка в свободные «карманы»
  const sheets=[];
  const newSheet = () => { const s={y:m, shelves:[], slots:[], parts:[], area:0}; sheets.push(s); return s; };
  let bad=false;
  for(const it of items){
    if(it.w > W-2*m+1e-6 || it.h > H-2*m+1e-6){ bad=true; continue; }
    let done=false;
    for(const sh of sheets){ if(done) break;
      for(const sl of sh.slots){ if(it.w<=sl.w+1e-6 && it.h<=sl.h+1e-6){ put(sh,it,sl.x,sl.y); sl.y+=it.h+g; sl.h-=it.h+g; done=true; break; } } }
    for(const sh of sheets){ if(done) break;
      for(const f of sh.shelves){ if(it.h<=f.h+1e-6 && f.x+it.w<=W-m+1e-6){ put(sh,it,f.x,f.y);
        if(f.h-it.h-g>10) sh.slots.push({x:f.x,y:f.y+it.h+g,w:it.w,h:f.h-it.h-g});
        f.x+=it.w+g; done=true; break; } } }
    for(const sh of sheets){ if(done) break;
      if(sh.y+it.h<=H-m+1e-6){ const f={y:sh.y,h:it.h,x:m}; sh.shelves.push(f); sh.y+=it.h+g; put(sh,it,f.x,f.y); f.x+=it.w+g; done=true; } }
    if(!done){ const sh=newSheet(); const f={y:sh.y,h:it.h,x:m}; sh.shelves.push(f); sh.y+=it.h+g; put(sh,it,f.x,f.y); f.x+=it.w+g; }
  }
  if(bad) warns.push('Часть деталей не помещается на лист выбранного размера — увеличьте лист или уменьшите шаг сетки / высоту ламелей.');
  function put(sh,it,x0,y0){
    const add = (shape, tf, kind, label, lp) => { const P={kind, outer:shape.outer.map(tf), holes:shape.holes.map(h=>h.map(tf)), label};
      if(lp){ P.lx=lp[0]; P.ly=lp[1]; } sh.parts.push(P); sh.area += shape.area!==undefined ? shape.area : 0; };
    if(it.kind==='lid') add(lid, p=>[x0+p[0], y0+p[1]], 'lid', 'LID', [x0+G.lidS/2, y0+G.lidS/2]);
    else if(it.kind==='key') add(key, p=>[x0+p[0], y0+p[1]], 'key', '');
    else {
      const A=it.A, tA = p=>[x0+p[0], y0+G.tabH-p[1]];
      add({outer:A.shape.outer, holes:A.shape.holes, area:A.area}, tA, 'lam', A.id, tA([40,-13]));
      if(it.kind==='pair'){ const B=it.B, yb=y0+G.tabH+it.D;
        const tB = it.mode ? (p=>[x0+p[0], yb+p[1]]) : (p=>[x0+Lb-p[0], yb+p[1]]);
        add({outer:B.shape.outer, holes:B.shape.holes, area:B.area}, tB, 'lam', B.id, tB([40,-13])); }
    }
  }
  sheets.forEach(sh=>{ sh.usage = sh.area/(W*H)*100; });
  return {sheets, W, H};
}

// ---------- DXF (R12, слои CUT / CUT_IN / MARK / SHEET) ----------
function dxf(build){
  const L=[]; const p=(...a)=>{ for(const x of a) L.push(x); };
  p(0,'SECTION',2,'HEADER',9,'$ACADVER',1,'AC1009',0,'ENDSEC');
  p(0,'SECTION',2,'TABLES');
  p(0,'TABLE',2,'LTYPE',70,1,0,'LTYPE',2,'CONTINUOUS',70,0,3,'Solid line',72,65,73,0,40,'0.0',0,'ENDTAB');
  const layers=[['CUT',7],['CUT_IN',1],['MARK',3],['SHEET',8]];
  p(0,'TABLE',2,'LAYER',70,layers.length);
  for(const [n,c] of layers) p(0,'LAYER',2,n,70,0,62,c,6,'CONTINUOUS');
  p(0,'ENDTAB',0,'ENDSEC',0,'SECTION',2,'ENTITIES');
  const f = v => (Math.round(v*1000)/1000).toFixed(3);
  const api = {
    poly(pts,layer){ p(0,'POLYLINE',8,layer,66,1,70,1,10,'0.0',20,'0.0',30,'0.0');
      for(const q of pts) p(0,'VERTEX',8,layer,10,f(q[0]),20,f(q[1]),30,'0.0'); p(0,'SEQEND',8,layer); },
    text(x,y,h,s){ p(0,'TEXT',8,'MARK',10,f(x),20,f(y),30,'0.0',40,f(h),1,s); }
  };
  build(api);
  p(0,'ENDSEC',0,'EOF');
  return L.join('\r\n')+'\r\n';
}
function sheetToDxf(api, sh, ox){ // в DXF ось Y вверх
  const H=S.sheetH, t = q=>[ox+q[0], H-q[1]];
  api.poly(rect(ox,0,S.sheetW,H),'SHEET');
  for(const P of sh.parts){
    for(const h of P.holes) api.poly(h.map(t),'CUT_IN');
    api.poly(P.outer.map(t),'CUT');
    if(S.marks && P.label && P.lx!==undefined){ const hgt = P.kind==='lid'?14:8; api.text(ox+P.lx-0.35*hgt*P.label.length, H-P.ly-hgt/2, hgt, P.label); }
  }
}
function partDxf(shape,label){ return dxf(api=>{ for(const h of shape.holes) api.poly(h,'CUT_IN'); api.poly(shape.outer,'CUT'); if(label) api.text(34,-17,8,label); }); }

// ---------- CSV ----------
function specCsv(){
  const st=M.st, G=M.G, n=v=>String(Math.round(v*100)/100).replace('.',','), R=[];
  R.push(['ФЕТР — спецификация']);
  R.push(['Потолок', `${S.nx} × ${S.ny} ячеек, шаг ${S.cell} мм, профиль ${S.profile}`]);
  R.push(['Материал', `фетр ${S.t} мм, лист ${S.sheetW} × ${S.sheetH} мм`]);
  R.push([]);
  R.push(['Деталь','Обозначение','Кол-во, шт','Габарит, мм','Площадь 1 шт, м²','Рез 1 шт, м']);
  for(const T of M.typeList) R.push(['Ламель',T.id,T.count,`${G.Lb} × ${T.maxH+Math.round(G.tabH)}`,n(T.area/1e6),n(T.perim/1000)]);
  R.push(['Крышка','LID',st.nCass,`${G.lidS} × ${G.lidS}`,n(M.lid.area/1e6),n(M.lid.perim/1000)]);
  R.push(['Ригель-шпонка','KEY',st.nCass*2,`${G.keyLen} × ${G.keyW}`,n(M.key.area/1e6),n(M.key.perim/1000)]);
  R.push([]);
  R.push(['Кассет, шт',st.nCass]); R.push(['Ламелей, шт',st.nLam]); R.push(['Типов ламелей',st.types]);
  R.push(['Листов, шт',st.sheets]); R.push(['Площадь деталей, м²',n(st.partArea/1e6)]); R.push(['Использование листа, %',n(st.usage)]);
  R.push(['Длина реза, м',n(st.cutLen/1000)]); R.push(['Вес, кг',n(st.weight)]);
  if(st.cost>0) R.push(['Стоимость, ₽',n(st.cost)]);
  return '﻿'+R.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n')+'\r\n';
}
function assemblyCsv(){
  const R=[['Кассета','Кол-во','Ячейки (столбец-ряд)','Позиция от метки','Ламель','Конец с маркировкой','Высота у метки, мм','Высота напротив, мм']];
  for(const K of M.cassList) K.items.forEach((it,n)=>{ const hs = it.flip ? it.T.hs.slice().reverse() : it.T.hs;
    R.push([K.id,K.count,K.cells.map(c=>`${c.i+1}-${c.j+1}`).join(' '),n+1,it.T.id,it.flip?'напротив метки':'у метки',hs[0],hs[hs.length-1]]); });
  return '﻿'+R.map(r=>r.map(c=>`"${c}"`).join(';')).join('\r\n')+'\r\n';
}

`  Окно шипа ${G.winW} x ${fmt(G.winH,1)} мм, паз крышки ${G.tabW+1} x ${fmt(G.t+0.6,1)} мм.`,'',

// ---------- ZIP (без сжатия) ----------
const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files, usdz){ // [{name, text}]; usdz — данные каждого файла с 64-байтной границы
  const enc=new TextEncoder(), chunks=[], cd=[]; let off=0;
  const d=new Date(), dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){ const nm=enc.encode(f.name), data=f.bytes||enc.encode(f.text), crc=crc32(data);
    let ex=new Uint8Array(0); if(usdz){ let n=(64-((off+30+nm.length)%64))%64; if(n<4) n+=64; ex=new Uint8Array(n); ex[0]=0x39; ex[1]=0x30; ex[2]=(n-4)&255; ex[3]=(n-4)>>8; }
    const fl = usdz ? 0 : 0x0800;
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,fl,true); h.setUint16(8,0,true);
    h.setUint16(10,tm,true); h.setUint16(12,dt,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nm.length,true); h.setUint16(28,ex.length,true);
    chunks.push(new Uint8Array(h.buffer), nm, ex, data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,fl,true); c.setUint16(10,0,true);
    c.setUint16(12,tm,true); c.setUint16(14,dt,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nm.length,true);
    c.setUint32(42,off,true); cd.push(new Uint8Array(c.buffer), nm);
    off += 30+nm.length+ex.length+data.length; }
  const cdLen = cd.reduce((s,a)=>s+a.length,0);
  const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdLen,true); e.setUint32(16,off,true);
  return new Blob([...chunks, ...cd, new Uint8Array(e.buffer)], {type: usdz ? 'model/vnd.usdz+zip' : 'application/zip'});
}
function makeZip(){
  const files=[], G=M.G;
  M.nest.sheets.forEach((sh,n)=> files.push({name:`sheets/sheet_${String(n+1).padStart(2,'0')}.dxf`, text: dxf(api=>sheetToDxf(api,sh,0))}));
  files.push({name:'all_sheets.dxf', text: dxf(api=> M.nest.sheets.forEach((sh,n)=>sheetToDxf(api,sh,n*(S.sheetW+100))))});
  for(const T of M.typeList) files.push({name:`parts/${T.id}.dxf`, text: partDxf(T.shape, T.id)});
  files.push({name:'parts/LID.dxf', text: partDxf(M.lid,'')});
  files.push({name:'parts/KEY.dxf', text: partDxf(M.key,'')});
  files.push({name:'specification.csv', text: specCsv()});
  files.push({name:'assembly.csv', text: assemblyCsv()});
  files.push({name:'README.txt', text: readme()});
  files.push({name:'project.json', text: JSON.stringify(S,null,1)});
  return zip(files);
}
function download(name, blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }

// ---------- боковая панель ----------
function buildSide(){
  const el=$('#side'); let h='', np=0; const secs=CTRL.filter(c=>c.sec);
  h+='<div class="ptabs">'+secs.map((c,i)=>`<button class="ptab${i===0?' on':''}" data-p="${i}">${c.tab}</button>`).join('')+'</div><div class="panes">';
  for(const c of CTRL){
    if(c.sec){ h+=(np?'</div>':'')+`<div class="pane${np===0?' on':''}" data-p="${np}"><h2>${c.sec}</h2>`+(c.hint?`<p class="hint">${c.hint}</p>`:''); np++;
      if(c.files) h+='<div class="onlym"><div class="stats" id="stats2"></div><button class="btn primary" data-act="zip">Файлы для ЧПУ (.zip)</button><button class="btn" data-act="csv">Спецификация .csv</button><p class="hint" style="margin-top:8px">Стоимость — необязательно: укажите цены, итог появится в спецификации.</p></div>';
      continue; }
    if(c.presets){ h+='<div class="chips">'+PRESETS.map((p,i)=>`<button class="chip" data-preset="${i}">${p[0]}</button>`).join('')+'</div>'; continue; }
    if(c.colors){ h+='<div class="f"><label>Цвет фетра</label><div class="sw" id="sw">'+FELTS.map(f=>`<button data-col="${f[0]}" title="${f[1]}" aria-label="${f[1]}" style="background:${f[0]}"></button>`).join('')+'<input type="color" id="colPick" aria-label="Свой цвет"></div></div>'; continue; }
    if(c.reset){ h+='<button class="btn" id="btnReset" style="margin-top:10px">Сбросить настройки</button>'; continue; }
    if(c.type==='range') h+=`<div class="f"><label for="r_${c.k}">${c.label}</label><div class="row"><input type="range" id="r_${c.k}" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}"><div class="num"><input type="number" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" aria-label="${c.label}"><i>${c.unit}</i></div></div></div>`;
    else if(c.type==='select') h+=`<div class="f"><label for="s_${c.k}">${c.label}</label><select id="s_${c.k}" data-k="${c.k}" ${c.num?'data-num="1"':''}>${c.opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`;
    else if(c.type==='check') h+=`<label class="check"><input type="checkbox" data-k="${c.k}">${c.label}</label>`;
  }
  el.innerHTML=h+'</div></div>';
  el.addEventListener('input', e=>{ const t=e.target, k=t.dataset.k;
    if(t.id==='colPick'){ S.felt=t.value; syncSide(); schedule(); return; }
    if(!k) return;
    if(t.type==='checkbox') S[k]=t.checked;
    else if(t.tagName==='SELECT') S[k]= t.dataset.num ? +t.value : t.value;
    else { const v=parseFloat(t.value); if(isNaN(v)) return; S[k]= t.type==='number' ? v : v; }
    if(t.type!=='number') syncSide(t); else { const r=el.querySelector(`input[type=range][data-k="${k}"]`); if(r) r.value=S[k]; }
    schedule(); });
  el.addEventListener('change', e=>{ const t=e.target; if(t.type==='number' && t.dataset.k){ S[t.dataset.k]=clamp(parseFloat(t.value)||+t.min, +t.min, +t.max); syncSide(); schedule(); } });
  el.addEventListener('click', e=>{ const t=e.target;
    if(t.classList.contains('ptab')){ for(const x of el.querySelectorAll('.ptab,.pane')) x.classList.toggle('on', x.dataset.p===t.dataset.p); el.querySelector('.panes').scrollTop=0; return; }
    if(t.dataset.act==='zip'){ $('#btnZip').click(); return; } if(t.dataset.act==='csv'){ $('#btnCsv').click(); return; }
    if(t.dataset.preset!==undefined){ Object.assign(S, PRESETS[+t.dataset.preset][1]); S.preset=+t.dataset.preset; syncSide(); schedule(); }
    else if(t.dataset.col){ S.felt=t.dataset.col; syncSide(); schedule(); }
    else if(t.id==='btnReset'){ S=JSON.parse(JSON.stringify(DEF)); syncSide(); schedule(); } });
  syncSide();
}
function syncSide(skip){
  for(const i of document.querySelectorAll('#side [data-k]')){ if(i===skip && i.type==='number') continue; const k=i.dataset.k;
    if(i.type==='checkbox') i.checked=!!S[k]; else if(document.activeElement!==i || i.type==='range') i.value=S[k]; }
  for(const b of document.querySelectorAll('#sw button')) b.classList.toggle('on', b.dataset.col===S.felt);
  const cp=$('#colPick'); if(cp) cp.value=S.felt;
}

// ---------- план и монтаж ----------
const pathOf = pts => 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z';
function cellFrame(c){ // локальные (u,v) мм → мировые мм
  const x0=c.i*S.cell, y0=c.j*S.cell, C=S.cell;
  switch(((c.r%360)+360)%360){
    case 0: return (u,v)=>[x0+u, y0+v];
    case 90: return (u,v)=>[x0+C-v, y0+u];
    case 180: return (u,v)=>[x0+C-u, y0+C-v];
    default: return (u,v)=>[x0+v, y0+C-u];
  }
}
function renderPlan(){
  const G=M.G, C=S.cell, W=S.nx*C, H=S.ny*C, fl=G.flange;
  let s=`<svg id="plan" viewBox="${-40} ${-40} ${W+80} ${H+80}" width="${Math.min(1100,(W+80)/2.2)}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#1b2422"/>`;
  for(const c of M.cells){ const x=c.i*C, y=c.j*C;
    if(c.kind==='tile') s+=`<rect x="${x}" y="${y}" width="${C}" height="${C}" fill="#d9d6cf"/><text x="${x+C/2}" y="${y+C/2+14}" text-anchor="middle" font-size="42" fill="#77736b">плита</text>`;
    else if(c.kind==='light') s+=`<rect x="${x}" y="${y}" width="${C}" height="${C}" fill="#fff6cf"/><circle cx="${x+C/2}" cy="${y+C/2-20}" r="70" fill="none" stroke="#c9a53a" stroke-width="10"/><text x="${x+C/2}" y="${y+C/2+130}" text-anchor="middle" font-size="42" fill="#8a7426">свет</text>`;
    else { const f=cellFrame(c); s+=`<rect x="${x}" y="${y}" width="${C}" height="${C}" fill="${S.felt}" opacity=".28"/>`;
      // порядок линий — как в карте сборки, от метки
      const span = Math.max(1,S.hMax-S.hMin);
      c.K.items.forEach((it,k)=>{ const v=G.a0+G.pitch*(k+0.5), a=f(G.a0,v), b=f(G.a0+G.Lb,v), hs=it.flip?it.T.hs.slice().reverse():it.T.hs;
        const avg=hs.reduce((q,w)=>q+w,0)/hs.length; s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${S.felt}" stroke-width="${G.t}" opacity="${(0.45+0.55*(avg-S.hMin)/span).toFixed(2)}"/>`; });
      const o=f(46,24); s+=`<circle cx="${o[0]}" cy="${o[1]}" r="15" fill="#fff"/>`;
      s+=`<text x="${x+C/2}" y="${y+C/2+22}" text-anchor="middle" font-size="64" font-weight="700" font-family="monospace" fill="#fff" stroke="#0e1413" stroke-width="10" paint-order="stroke">${c.K.id}</text>`; }
    s+=`<rect class="cellhit" data-c="${c.i},${c.j}" x="${x}" y="${y}" width="${C}" height="${C}" fill="transparent"><title>Ячейка ${c.i+1}-${c.j+1}: клик — сменить тип</title></rect>`;
  }
  const gc = S.gridColor==='white' ? '#f1f1ec' : S.gridColor==='black' ? '#111' : S.felt;
  for(let i=0;i<=S.nx;i++) s+=`<rect x="${i*C-fl/2}" y="${-fl/2}" width="${fl}" height="${H+fl}" fill="${gc}" pointer-events="none"/>`;
  for(let j=0;j<=S.ny;j++) s+=`<rect x="${-fl/2}" y="${j*C-fl/2}" width="${W+fl}" height="${fl}" fill="${gc}" pointer-events="none"/>`;
  for(let i=0;i<S.nx;i++) s+=`<text x="${i*C+C/2}" y="-18" text-anchor="middle" font-size="30" fill="#8fa39d">${i+1}</text>`;
  for(let j=0;j<S.ny;j++) s+=`<text x="-22" y="${j*C+C/2+10}" text-anchor="middle" font-size="30" fill="#8fa39d">${j+1}</text>`;
  s+='</svg>';
  let h=`<div class="plan-wrap">${s}<div class="legend"><span>План потолка, вид сверху (как на чертеже). ${fmt(W)} × ${fmt(H)} мм</span><span>● — метка угла: от неё считаются позиции ламелей</span><span>Плит: ${M.st.nTile}, светильников: ${M.st.nLight}</span></div></div>`;
  h+=`<p class="note">Одинаковые кассеты имеют один номер. В карте сборки ламели перечислены от стороны с меткой ●; «у метки» означает, что конец ламели с выгравированным номером обращён к стороне метки. Высоты даны для проверки ориентации.</p>`;
  h+='<div class="kcards">';
  const maxK=48;
  M.cassList.slice(0,maxK).forEach(K=>{
    h+=`<div class="kcard"><h4>${K.id} <span>× ${K.count} шт · ячейки ${K.cells.slice(0,14).map(c=>(c.i+1)+'-'+(c.j+1)).join(', ')}${K.cells.length>14?'…':''}</span></h4>`;
    h+='<table><tr><th>№</th><th>Ламель</th><th>Профиль (метка слева)</th><th class="n">Высота, мм</th></tr>';
    K.items.forEach((it,n)=>{ const hs = it.flip ? it.T.hs.slice().reverse() : it.T.hs;
      h+=`<tr><td class="m">${n+1}</td><td class="m">${it.T.id}${it.flip?' ⇄':''}</td><td>${miniProfile(hs)}</td><td class="n">${hs[0]} → ${hs[hs.length-1]}</td></tr>`; });
    h+='</table></div>'; });
  h+='</div>';
  if(M.cassList.length>maxK) h+=`<p class="note" style="margin-top:12px">Показаны первые ${maxK} типов кассет из ${M.cassList.length}. Полная карта сборки — в файле assembly.csv в архиве.</p>`;
  $('#vplan').innerHTML=h;
}
function miniProfile(hs){ const w=120, hh=26, mx=S.hMax, n=hs.length-1;
  return `<svg class="mini" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}"><path d="M0 0L${w} 0L${hs.slice().reverse().map((v,i)=>`${(w*(n-i)/n).toFixed(1)} ${(v/mx*hh).toFixed(1)}`).join('L')}Z" fill="${S.felt}"/></svg>`; }
$('#vplan').addEventListener('click', e=>{ const k=e.target.dataset && e.target.dataset.c; if(!k) return;
  const cur=S.cells[k]; if(!cur) S.cells[k]='tile'; else if(cur==='tile') S.cells[k]='light'; else delete S.cells[k]; schedule(); });

// ---------- геометрия кассет в мм: X — ширина, Z — глубина, Y вверх, потолок на Y=0 ----------
function cassQuads(quad){
  const G=M.G, C=S.cell;
  for(const c of M.cells){ if(c.kind!=='cass') continue; const x=c.i*C, z=c.j*C;
    quad([x,0,z],[x+C,0,z],[x+C,0,z+C],[x,0,z+C],[0,-1,0],true);
    const r0 = c.dir==='x';
    for(const l of c.lams){ const M2=l.hs.length-1, pts=simplify(l.hs.map((h,i)=>[G.a0+G.Lb*i/M2, h]));
      const w = r0 ? (u,v,y)=>[x+u,y,z+v] : (u,v,y)=>[x+C-v,y,z+u];
      const v1=l.v-G.t/2, v2=l.v+G.t/2, nA = r0?[0,0,-1]:[1,0,0], nB = r0?[0,0,1]:[-1,0,0];
      for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1];
        quad(w(a[0],v1,0),w(b[0],v1,0),w(b[0],v1,-b[1]),w(a[0],v1,-a[1]),nA);
        quad(w(a[0],v2,0),w(b[0],v2,0),w(b[0],v2,-b[1]),w(a[0],v2,-a[1]),nB);
        const dl=Math.hypot(b[0]-a[0],b[1]-a[1]), nu=(b[1]-a[1])/dl, ny=-(b[0]-a[0])/dl;
        quad(w(a[0],v1,-a[1]),w(b[0],v1,-b[1]),w(b[0],v2,-b[1]),w(a[0],v2,-a[1]), r0 ? [nu,ny,0] : [0,ny,nu]); }
      const a=pts[0], b=pts[pts.length-1];
      quad(w(a[0],v1,0),w(a[0],v2,0),w(a[0],v2,-a[1]),w(a[0],v1,-a[1]), r0?[-1,0,0]:[0,0,-1]);
      quad(w(b[0],v1,0),w(b[0],v2,0),w(b[0],v2,-b[1]),w(b[0],v1,-b[1]), r0?[1,0,0]:[0,0,1]);
    } }
}

// ---------- USDZ для встроенного AR на iPhone (AR Quick Look) ----------
// Модель в метрах в натуральную величину. Встроенный AR iPhone кладёт объект на горизонтальную
// поверхность (пол, стол), поэтому инсталляция повёрнута на 180°: крышки лежат на поверхности,
// ламели смотрят вверх — сверху видно ровно то, что будет видно снизу на потолке.
// Мягкое затенение у крышки (ambient occlusion) запечено в текстуру-градиент по глубине ламели.
function aoTexture(){ // PNG 4×64: сверху светло, снизу темно; цвет фетра уже умножен
  const cv=document.createElement('canvas'); cv.width=4; cv.height=64; const g=cv.getContext('2d'), im=g.createImageData(4,64);
  const lin=[1,3,5].map(i=>Math.pow(parseInt(S.felt.slice(i,i+2),16)/255,2.2));
  for(let y=0;y<64;y++){ const t=1-y/63, k=0.38+0.62*Math.pow(t,0.8);
    for(let x=0;x<4;x++) for(let c=0;c<3;c++) im.data[(y*4+x)*4+c]=Math.round(255*Math.pow(lin[c]*k,1/2.2)); for(let x=0;x<4;x++) im.data[(y*4+x)*4+3]=255; }
  g.putImageData(im,0,0); const b=atob(cv.toDataURL('image/png').split(',')[1]), u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function makeUsdz(){
  const W=S.nx*S.cell, D=S.ny*S.cell, f=v=>(Math.round(v*1e4)/1e4).toString();
  const mesh=()=>({pts:[],nrm:[],st:[],n:0});
  const felt=mesh();
  const add=(m,a,b,c,d,n)=>{ // обход против часовой стрелки со стороны нормали
    const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2], vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    const gx=uy*vz-uz*vy, gy=uz*vx-ux*vz, gz=ux*vy-uy*vx, q = (gx*n[0]+gy*n[1]+gz*n[2])<0 ? [a,d,c,b] : [a,b,c,d];
    for(const p of q){ m.pts.push('('+f(p[0])+', '+f(p[1])+', '+f(p[2])+')'); m.nrm.push('('+f(n[0])+', '+f(n[1])+', '+f(n[2])+')');
      m.st.push('(0.5, '+f(clamp(p[3]/AOD,0,1))+')'); } m.n++; };
  const AOD=Math.max(90, Math.min(160, S.hMax*0.6));            // глубина затенения от крышки, мм
  const tf=p=>[(p[0]-W/2)/1000, -p[1]/1000, -(p[2]-D/2)/1000, -p[1]]; // поворот на 180° вокруг X + глубина для затенения
  const rn=n=>[n[0],-n[1],-n[2]];
  cassQuads((a,b,c,d,n)=>add(felt,tf(a),tf(b),tf(c),tf(d),rn(n)));
  const prim=(name,m,mat)=>`    def Mesh "${name}" (
        prepend apiSchemas = ["MaterialBindingAPI"]
    )
    {
        uniform bool doubleSided = 1
        int[] faceVertexCounts = [${new Array(m.n).fill(4).join(', ')}]
        int[] faceVertexIndices = [${Array.from({length:m.n*4},(_,i)=>i).join(', ')}]
        normal3f[] normals = [${m.nrm.join(', ')}] (
            interpolation = "vertex"
        )
        point3f[] points = [${m.pts.join(', ')}]
        texCoord2f[] primvars:st = [${m.st.join(', ')}] (
            interpolation = "vertex"
        )
        uniform token subdivisionScheme = "none"
        rel material:binding = </Root/Materials/${mat}>
    }
`;
  const mat=name=>`        def Material "${name}"
        {
            token outputs:surface.connect = </Root/Materials/${name}/Surface.outputs:surface>
            def Shader "Surface"
            {
                uniform token info:id = "UsdPreviewSurface"
                color3f inputs:diffuseColor.connect = </Root/Materials/${name}/AO.outputs:rgb>
                float inputs:roughness = 0.95
                float inputs:metallic = 0
                token outputs:surface
            }
            def Shader "UV"
            {
                uniform token info:id = "UsdPrimvarReader_float2"
                string inputs:varname = "st"
                float2 outputs:result
            }
            def Shader "AO"
            {
                uniform token info:id = "UsdUVTexture"
                asset inputs:file = @ao.png@
                float2 inputs:st.connect = </Root/Materials/${name}/UV.outputs:result>
                token inputs:sourceColorSpace = "sRGB"
                token inputs:wrapS = "clamp"
                token inputs:wrapT = "clamp"
                float3 outputs:rgb
            }
        }
`;
  const usda=`#usda 1.0
(
    customLayerData = {
        string creator = "FETR"
    }
    defaultPrim = "Root"
    metersPerUnit = 1
    upAxis = "Y"
)

def Xform "Root"
{
${prim('Felt',felt,'Felt')}    def Scope "Materials"
    {
${mat('Felt')}    }
}
`;
  return zip([{name:'fetr.usda', text:usda},{name:'ao.png', bytes:aoTexture()}], true);
}

// ---------- 3D (собственный WebGL, без библиотек) ----------
const GL = (()=>{
  const cv=$('#gl'); let gl=null, prog, buf={}, count=0, arCount=0, ok=false;
  const cam={yaw:0.65, pitch:-0.5, dist:4000, tx:0, ty:0, tz:0};
  const api={fresh:false};
  try{ gl = cv.getContext('webgl',{antialias:true, alpha:true, xrCompatible:!!navigator.xr}) || cv.getContext('webgl',{antialias:true}) || cv.getContext('experimental-webgl'); }catch(e){}
  if(gl){
    const vs=`attribute vec3 p; attribute vec3 n; attribute vec3 c; uniform mat4 m; varying vec3 vn; varying vec3 vc; varying float vy;
      void main(){ vn=n; vc=c; vy=p.y; gl_Position=m*vec4(p,1.0); }`;
    const fs=`precision mediump float; varying vec3 vn; varying vec3 vc; varying float vy; uniform float ao;
      void main(){ vec3 col=vc;
        if(dot(vn,vn)>0.01){ vec3 N=normalize(vn); if(!gl_FrontFacing) N=-N;
          float d1=max(dot(N,normalize(vec3(0.45,-0.55,0.7))),0.0), d2=max(dot(N,normalize(vec3(-0.7,-0.25,-0.5))),0.0), d3=max(dot(N,vec3(0.0,-1.0,0.0)),0.0);
          col*= 0.40 + 0.50*d1 + 0.26*d2 + 0.12*d3;
          col*= mix(0.55,1.0,smoothstep(0.0,ao,-vy)); }
        gl_FragColor=vec4(col,1.0); }`;
    const sh=(t,s)=>{ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    try{ prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(prog);
      if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error('link'); gl.useProgram(prog);
      for(const a of ['p','n','c']){ buf[a]=gl.createBuffer(); }
      gl.enable(gl.DEPTH_TEST); ok=true; }catch(e){ console.error(e); }
  }
  if(!ok){ const d=document.createElement('p'); d.className='note'; d.style.padding='20px'; d.textContent='3D-вид недоступен: браузер не дал WebGL. План, раскрой и выгрузка файлов работают.'; cv.replaceWith(d); }
  const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];

  api.upload = function(){ if(!ok) return; api.fresh=true;
    const P=[],N=[],Cc=[]; const G=M.G, C=S.cell, W=S.nx*C, D=S.ny*C;
    const tri3=(a,b,c,n,col)=>{ P.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]); for(let i=0;i<3;i++){ N.push(n[0],n[1],n[2]); Cc.push(col[0],col[1],col[2]); } };
    const quad=(a,b,c,d,n,col)=>{ tri3(a,b,c,n,col); tri3(a,c,d,n,col); };
    const felt=hex(S.felt), lidC=felt.map(v=>v*0.86), tile=[0.90,0.89,0.86], light=[1,0.985,0.9], back=[0.83,0.82,0.79];
    const gridC = S.gridColor==='white' ? [0.97,0.97,0.95] : S.gridColor==='black' ? [0.08,0.08,0.08] : felt.map(v=>v*0.8);
    cassQuads((a,b,c,d,n,isLid)=>quad(a,b,c,d,n,isLid?lidC:felt));
    arCount=P.length/3;
    // потолок вокруг, плиты, светильники, профиль
    const E=C*1.5; quad([-E,2,-E],[W+E,2,-E],[W+E,2,D+E],[-E,2,D+E],[0,0,0],back);
    for(const c of M.cells){ const x=c.i*C, z=c.j*C;
      if(c.kind==='tile') quad([x,0,z],[x+C,0,z],[x+C,0,z+C],[x,0,z+C],[0,0,0],tile);
      else if(c.kind==='light') quad([x,0,z],[x+C,0,z],[x+C,0,z+C],[x,0,z+C],[0,0,0],light); }
    const f=G.flange/2, y=-1.5;
    for(let i=0;i<=S.nx;i++) quad([i*C-f,y,-f],[i*C+f,y,-f],[i*C+f,y,D+f],[i*C-f,y,D+f],[0,0,0],gridC);
    for(let j=0;j<=S.ny;j++) quad([-f,y,j*C-f],[W+f,y,j*C-f],[W+f,y,j*C+f],[-f,y,j*C+f],[0,0,0],gridC);
    count=P.length/3;
    const up=(a,arr)=>{ gl.bindBuffer(gl.ARRAY_BUFFER,buf[a]); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW); const loc=gl.getAttribLocation(prog,a); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0); };
    up('p',P); up('n',N); up('c',Cc);
    const key=S.nx+'x'+S.ny+'x'+S.cell; if(api.sizeKey!==key){ api.sizeKey=key; api.view('persp'); }
  };
  api.view = function(name){ const W=S.nx*S.cell, D=S.ny*S.cell, R=Math.hypot(W,D);
    cam.tx=W/2; cam.tz=D/2; cam.ty=-S.hMax*0.3;
    if(name==='below'){ cam.yaw=0; cam.pitch=-1.5533; cam.dist=R*1.25; }
    else if(name==='side'){ cam.yaw=0; cam.pitch=-0.07; cam.dist=R*1.15; }
    else { cam.yaw=0.62; cam.pitch=-0.5; cam.dist=R*1.0; } };
  api.resize = function(){ if(!ok) return; const r=cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
    const w=Math.max(2,Math.round(r.width*dpr)), h=Math.max(2,Math.round(r.height*dpr)); if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; } };
  const mul=(a,b)=>{ const o=new Float32Array(16); for(let i=0;i<4;i++) for(let j=0;j<4;j++){ let s=0; for(let k=0;k<4;k++) s+=a[k*4+j]*b[i*4+k]; o[i*4+j]=s; } return o; };
  api.draw = function(){ if(!ok||!count||api.ar) return; gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,cv.width,cv.height); gl.clearColor(0.10,0.13,0.125,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    const asp=cv.width/cv.height, fov=38*Math.PI/180, f=1/Math.tan(fov/2), near=cam.dist*0.02, far=cam.dist*6;
    const dist = cam.dist * Math.max(1, 1.7/asp);
    const pr=new Float32Array([f/asp,0,0,0, 0,f,0,0, 0,0,(far+near)/(near-far),-1, 0,0,2*far*near/(near-far),0]);
    const cp=Math.cos(cam.pitch), ex=cam.tx+dist*cp*Math.sin(cam.yaw), ey=cam.ty+dist*Math.sin(cam.pitch), ez=cam.tz+dist*cp*Math.cos(cam.yaw);
    let zx=ex-cam.tx, zy=ey-cam.ty, zz=ez-cam.tz; const zl=Math.hypot(zx,zy,zz); zx/=zl; zy/=zl; zz/=zl;
    // "верх" камеры — вниз по миру: смотрим на потолок снизу
    let ux=0, uy=1, uz=0; let xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx; const xl=Math.hypot(xx,xy,xz)||1; xx/=xl; xy/=xl; xz/=xl;
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    const vw=new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0, -(xx*ex+xy*ey+xz*ez), -(yx*ex+yy*ey+yz*ez), -(zx*ex+zy*ey+zz*ez), 1]);
    gl.uniformMatrix4fv(gl.getUniformLocation(prog,'m'),false,mul(pr,vw));
    gl.uniform1f(gl.getUniformLocation(prog,'ao'), Math.max(60,S.hMax*0.55));
    gl.drawArrays(gl.TRIANGLES,0,count); };
  // --- для AR: рисуем только кассеты с готовой матрицей ---
  api.ok=()=>ok; api.gl=()=>gl; api.mul=mul; api.cv=cv;
  api.drawAR = function(mvp){ gl.uniformMatrix4fv(gl.getUniformLocation(prog,'m'),false,mvp);
    gl.uniform1f(gl.getUniformLocation(prog,'ao'), Math.max(60,S.hMax*0.55)); gl.drawArrays(gl.TRIANGLES,0,arCount); };
  // управление
  let drag=null; const pts=new Map();
  cv.addEventListener('pointerdown',e=>{ if(api.ar){ if(api.arDown) api.arDown(e); return; } cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); drag={x:e.clientX,y:e.clientY,pd:0}; cv.style.cursor='grabbing'; });
  cv.addEventListener('pointermove',e=>{ if(api.ar){ if(api.arMove) api.arMove(e); return; } if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){ const [a,b]=[...pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(drag.pd) cam.dist=clamp(cam.dist*drag.pd/d,300,60000); drag.pd=d; }
    else { cam.yaw-=(e.clientX-drag.x)*0.006; cam.pitch=clamp(cam.pitch+(e.clientY-drag.y)*0.005,-1.5533,0.6); drag.x=e.clientX; drag.y=e.clientY; }
    api.draw(); });
  const end=e=>{ if(api.ar){ if(api.arUp) api.arUp(e); return; } pts.delete(e.pointerId); if(drag) drag.pd=0; cv.style.cursor='grab'; };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); cam.dist=clamp(cam.dist*Math.exp(e.deltaY*0.0012),300,60000); api.draw(); },{passive:false});
  api.cam=cam; return api;
})();
document.querySelector('.vbtns').addEventListener('click', e=>{ const c=e.target.dataset.cam; if(c){ GL.view(c); GL.draw(); } });
window.addEventListener('resize', ()=>{ if(activeView==='v3d'){ GL.resize(); GL.draw(); } });

// ---------- AR: примерка на потолке через телефон ----------
const AR = (()=>{
  const ui=$('#arui'), hint=$('#arhint'), st={pos:[0,0,0], yaw:0, ceil:2.7, floorY:-1.5, placed:false, mode:null};
  try{ const c=parseFloat(localStorage.getItem('fetr-ceil')); if(c>1.8&&c<8) st.ceil=c; }catch(e){}
  let xrOK=false; if(navigator.xr && navigator.xr.isSessionSupported) navigator.xr.isSessionSupported('immersive-ar').then(v=>{ xrOK=v; }).catch(()=>{});
  const msg=t=>{ $('#armsgt').textContent=t; $('#armsg').classList.add('on'); };
  $('#armsgok').addEventListener('click',()=>$('#armsg').classList.remove('on'));
  const label=()=>{ $('#arh').textContent='потолок '+st.ceil.toFixed(2).replace('.',',')+' м'; };
  function model(){ // мм → метры, центр инсталляции в pos, поворот вокруг вертикали
    const s=0.001, c=Math.cos(st.yaw), n=Math.sin(st.yaw), ox=-S.nx*S.cell/2, oz=-S.ny*S.cell/2;
    return new Float32Array([s*c,0,-s*n,0, 0,s,0,0, s*n,0,s*c,0, st.pos[0]+s*(c*ox+n*oz), st.pos[1], st.pos[2]+s*(-n*ox+c*oz), 1]); }
  function persp(fx,fy,near,far){ return new Float32Array([fx,0,0,0, 0,fy,0,0, 0,0,(far+near)/(near-far),-1, 0,0,2*far*near/(near-far),0]); }
  const H_AIM='Наведите камеру на нужное место на потолке и нажмите «Поставить на место»';
  function setPlaced(v){ st.placed=v; $('#arplace').textContent = v ? '↺ Переставить' : '✓ Поставить на место';
    hint.textContent = v ? (st.mode==='cam' ? 'Стоит на месте. Пальцем можно подвинуть, кнопками — высота потолка и поворот' : 'Стоит на месте. Кнопками — высота потолка и поворот') : H_AIM; }
  function aim(p,d){ // точка на плоскости потолка по лучу взгляда; если смотрим не вверх — чуть впереди над головой
    const cy=st.floorY+st.ceil, hl=Math.hypot(d[0],d[2])||1;
    if(d[1]>0.2 && cy>p[1]){ const k=Math.min((cy-p[1])/d[1], 8); st.pos=[p[0]+d[0]*k, cy, p[2]+d[2]*k]; }
    else st.pos=[p[0]+d[0]/hl*1.2, cy, p[2]+d[2]/hl*1.2]; }
  function begin(mode){ st.mode=mode; setPlaced(false); GL.ar=true; GL.upload(); ui.classList.add('on'); ui.classList.toggle('cam',mode==='cam'); label(); }
  function finish(){ GL.ar=false; st.mode=null; ui.classList.remove('on','cam'); const g=GL.gl(); g.bindFramebuffer(g.FRAMEBUFFER,null);
    if(GL.cv.parentNode!==$('#v3d')) $('#v3d').insertBefore(GL.cv,$('#v3d').firstChild);
    GL.fresh=false; requestAnimationFrame(()=>render(true)); }

  // --- WebXR (Android Chrome): настоящая привязка к комнате ---
  let session=null;
  async function startXR(){
    const g=GL.gl();
    session = await navigator.xr.requestSession('immersive-ar',{optionalFeatures:['local-floor','hit-test','dom-overlay'], domOverlay:{root:ui}});
    begin('xr');
    try{ if(g.makeXRCompatible) await g.makeXRCompatible(); }catch(e){}
    session.updateRenderState({baseLayer:new XRWebGLLayer(session,g)});
    let ref; try{ ref=await session.requestReferenceSpace('local-floor'); st.floorY=0; }catch(e){ ref=await session.requestReferenceSpace('local'); st.floorY=-1.5; }
    let hitSrc=null; try{ const vs=await session.requestReferenceSpace('viewer'); hitSrc=await session.requestHitTestSource({space:vs}); }catch(e){}
    let tap=false; session.addEventListener('select',()=>{ tap=true; });
    session.addEventListener('end',()=>{ session=null; finish(); });
    const frame=(t,f)=>{ if(!session) return; session.requestAnimationFrame(frame);
      const pose=f.getViewerPose(ref); if(!pose) return;
      const layer=session.renderState.baseLayer, m=pose.transform.matrix, p=[m[12],m[13],m[14]], d=[-m[8],-m[9],-m[10]];
      if(!st.placed){ // объект ездит за взглядом, пока не нажата «Поставить на место»
        let done=false;
        if(hitSrc){ const hr=f.getHitTestResults(hitSrc); if(hr.length){ const hp=hr[0].getPose(ref); if(hp){ const q=hp.transform.position;
          if(q.y > p[1]+0.3){ st.ceil=Math.round((q.y-st.floorY)*100)/100; st.pos=[q.x,q.y,q.z]; done=true; label(); } } } }
        if(!done) aim(p,d);
        st.yaw=Math.atan2(-m[2],m[0]);
      }
      tap=false;
      st.pos[1]=st.floorY+st.ceil;
      g.bindFramebuffer(g.FRAMEBUFFER,layer.framebuffer); g.clearColor(0,0,0,0); g.clear(g.COLOR_BUFFER_BIT|g.DEPTH_BUFFER_BIT);
      const mod=model();
      for(const v of pose.views){ const vp=layer.getViewport(v); g.viewport(vp.x,vp.y,vp.width,vp.height);
        GL.drawAR(GL.mul(GL.mul(v.projectionMatrix, v.transform.inverse.matrix), mod)); }
    };
    session.requestAnimationFrame(frame);
  }

  // --- камера + гироскоп (iPhone и всё остальное): привязка по повороту телефона ---
  let stream=null, video=null, ori=null, raf=0, V=null;
  const m3=(a,b)=>{ const o=[]; for(let i=0;i<3;i++) for(let j=0;j<3;j++) o[i*3+j]=a[i*3]*b[j]+a[i*3+1]*b[3+j]+a[i*3+2]*b[6+j]; return o; };
  function viewRot(){ // мир (Y вверх) → камера, по углам deviceorientation
    const r=Math.PI/180, a=(ori.alpha||0)*r, b=(ori.beta||0)*r, c=(ori.gamma||0)*r;
    const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(c),sg=Math.sin(c);
    const R=m3(m3([ca,-sa,0, sa,ca,0, 0,0,1],[1,0,0, 0,cb,-sb, 0,sb,cb]),[cg,0,sg, 0,1,0, -sg,0,cg]);
    const Rt=[R[0],R[3],R[6], R[1],R[4],R[7], R[2],R[5],R[8]];
    const th=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*r, ct=Math.cos(th), s2=Math.sin(th);
    return m3(m3([ct,-s2,0, s2,ct,0, 0,0,1],Rt),[1,0,0, 0,0,-1, 0,1,0]); }
  async function startCam(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ msg('AR-примерка работает на телефоне: откройте эту страницу на смартфоне (Chrome на Android или Safari на iPhone) и нажмите «AR на потолке».'); return; }
    let perm='granted';
    try{ if(window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) perm=await DeviceOrientationEvent.requestPermission(); }catch(e){ perm='denied'; }
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false}); }
    catch(e){ msg('Не удалось включить камеру. Разрешите доступ к камере для этого сайта и попробуйте ещё раз.'); return; }
    begin('cam');
    video=document.createElement('video'); video.setAttribute('playsinline',''); video.muted=true; video.autoplay=true; video.srcObject=stream; ui.insertBefore(video,ui.firstChild);
    ui.insertBefore(GL.cv, video.nextSibling); try{ await video.play(); }catch(e){}
    ori=null; window.addEventListener('deviceorientation',onOri);
    setTimeout(()=>{ if(st.mode==='cam' && !ori) hint.textContent='Нет данных от датчика поворота — разрешите сайту «Движение и ориентация» в настройках браузера и зайдите в AR ещё раз'; }, 3000);
    st.floorY=-1.5; st.pos=[0, st.floorY+st.ceil, -1.2]; st.yaw=0;
    const loop=()=>{ if(st.mode!=='cam') return; raf=requestAnimationFrame(loop); if(!ori) return;
      const g=GL.gl(); GL.resize(); const w=GL.cv.width, h=GL.cv.height;
      V=viewRot();
      if(!st.placed){ aim([0,0,0],[-V[6],-V[7],-V[8]]); st.yaw=Math.atan2(-V[2],V[0]); }
      st.pos[1]=st.floorY+st.ceil;
      const fl=1/Math.tan(31.5*Math.PI/180), fx = h>=w ? fl*h/w : fl, fy = h>=w ? fl : fl*w/h;
      const view=new Float32Array([V[0],V[3],V[6],0, V[1],V[4],V[7],0, V[2],V[5],V[8],0, 0,0,0,1]);
      g.bindFramebuffer(g.FRAMEBUFFER,null); g.viewport(0,0,w,h); g.clearColor(0,0,0,0); g.clear(g.COLOR_BUFFER_BIT|g.DEPTH_BUFFER_BIT);
      GL.drawAR(GL.mul(GL.mul(persp(fx,fy,0.05,200),view),model())); };
    loop();
  }
  const onOri=e=>{ if(e.alpha!==null || e.beta!==null) ori={alpha:e.alpha,beta:e.beta,gamma:e.gamma}; };
  function stopCam(){ cancelAnimationFrame(raf); window.removeEventListener('deviceorientation',onOri);
    if(stream) for(const t of stream.getTracks()) t.stop(); stream=null; if(video){ video.remove(); video=null; } finish(); }
  // перетаскивание пальцем (режим камеры)
  let last=null;
  GL.arDown=e=>{ last=[e.clientX,e.clientY]; };
  GL.arMove=e=>{ if(!last||st.mode!=='cam'||!V||!st.placed) return; const dx=e.clientX-last[0], dy=e.clientY-last[1]; last=[e.clientX,e.clientY];
    const k=Math.max(0.5,st.ceil-1.5)*1.3/Math.max(innerWidth,innerHeight);
    st.pos[0]+=(V[0]*dx-V[3]*dy)*k; st.pos[2]+=(V[2]*dx-V[5]*dy)*k; };
  GL.arUp=()=>{ last=null; };

  $('#arbot').addEventListener('beforexrselect',e=>e.preventDefault());
  $('#arbot').addEventListener('click',e=>{ const a=e.target.dataset.ar; if(!a) return;
    if(a==='place'){ setPlaced(!st.placed); return; }
    if(a==='h+') st.ceil=Math.min(8,st.ceil+0.05); else if(a==='h-') st.ceil=Math.max(1.8,st.ceil-0.05);
    else if(a==='r+') st.yaw-=Math.PI/12; else if(a==='r-') st.yaw+=Math.PI/12;
    else if(a==='exit'){ if(session) session.end(); else stopCam(); return; }
    label(); try{ localStorage.setItem('fetr-ceil',st.ceil); }catch(e){} });
  // iPhone / iPad: встроенный AR (Quick Look) — настоящая привязка к комнате
  const QL = (()=>{ try{ return document.createElement('a').relList.supports('ar'); }catch(e){ return false; } })();
  $('#btnAR').addEventListener('click', async ()=>{
    if(QL){ // сразу во встроенный AR, без вопросов
      const a=document.createElement('a'); a.rel='ar'; a.appendChild(document.createElement('img'));
      a.href=URL.createObjectURL(makeUsdz()); a.download='fetr.usdz'; a.click(); return; }
    if(!GL.ok()){ msg('AR недоступен: браузер не дал WebGL.'); return; }
    if(xrOK){ try{ await startXR(); return; }catch(e){ if(session){ try{ session.end(); }catch(_){} } } }
    startCam(); });
  return {st};
})();

// ---------- кнопки ----------
$('#btnZip').addEventListener('click', ()=> download(`fetr_${S.nx}x${S.ny}_cnc.zip`, makeZip()));
$('#btnCsv').addEventListener('click', ()=> download('fetr_specification.csv', new Blob([specCsv()],{type:'text/csv;charset=utf-8'})));

// ---------- проверка новой версии: сравниваем страницу на сервере с той, что открыта ----------
(()=>{ if(!/^https?:/.test(location.protocol)) return; let base=null;
  const get=()=>fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject()).then(t=>t.length+':'+crc32(new TextEncoder().encode(t)));
  const check=()=>{ if(document.hidden) return; get().then(h=>{ if(base===null) base=h; else if(h!==base) document.body.classList.add('hasupd'); }).catch(()=>{}); };
  check(); setInterval(check,120000); document.addEventListener('visibilitychange',check);
  for(const b of document.querySelectorAll('.upd')) b.addEventListener('click',()=>location.reload());
})();

// ---------- старт ----------
buildSide(); build(); render(true);
</script>
